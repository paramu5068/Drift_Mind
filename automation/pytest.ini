[pytest]
testpaths = automation/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    smoke: Smoke test cases
    regression: Full regression test cases
    auth: Authentication and Authorization tests
    ui: UI and Layout verification tests
    forms: Form interaction tests
    crud: CRUD operations tests
    performance: Performance smoke tests
